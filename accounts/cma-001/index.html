<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    Corbett Water Report
  </title>

  <link
    rel="stylesheet"
    href="../../assets/css/styles.css">

  <script
    src="../../assets/js/app.js"
    defer>
  </script>

</head>

<body>

  <main class="report">

    <p class="eyebrow">
      CORBETT IRRIGATION · SMART WATER MANAGEMENT
    </p>

    <h1 id="report-name">
      Loading report…
    </h1>

    <p
      id="report-period"
      class="report-period">
    </p>

    <div
      id="report-status"
      class="status">
    </div>

    <section class="test-card">

      <h2 id="month-name">
        Loading…
      </h2>

      <p class="usage-label">
        Irrigation Usage
      </p>

      <p
        id="month-usage"
        class="usage">
        —
      </p>

    </section>

    <p class="helper">
      Architecture test — account data is loaded separately from the shared website code.
    </p>

    <p
      id="report-error"
      class="error"
      hidden>
    </p>

  </main>

</body>

</html>
